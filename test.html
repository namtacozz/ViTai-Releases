<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ViTai Benchmark - Kiểm thử độ chính xác AI</title>
  <link rel="icon" type="image/x-icon" href="assets/icon.ico">
  
  <!-- Typography matching ViTai & Java baseline -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@600;700;800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================================
       ViTai Interactive Benchmark Suite - 100vh No-Scroll Vertical Layout
       Tối ưu hoàn hảo cho quay TikTok (9:16 Portrait / Không cần cuộn chuột)
       Mọi nội dung (Đề bài, Code/Canvas, 4 đáp án A-B-C-D, Nút điều hướng)
       nằm trọn 100% trong màn hình!
       ========================================================================== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      height: 100dvh;
      overflow: hidden; /* Cố định 1 màn hình, triệt tiêu thanh cuộn */
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #F8FAFC;
      color: #0F172A;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Top Bar Tinh Gọn (Brand + Progress Bar trong 1 hàng duy nhất) */
    .top-header-bar {
      flex-shrink: 0;
      height: 44px;
      background: rgba(248, 250, 252, 0.98);
      border-bottom: 1px solid #E2E8F0;
      z-index: 50;
    }

    .top-header-inner {
      max-width: 540px;
      height: 100%;
      margin: 0 auto;
      padding: 0 14px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-tag {
      font-family: 'Instrument Sans', sans-serif;
      font-weight: 800;
      font-size: 14.5px;
      color: #E0562D;
      display: flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .brand-logo-img {
      width: 22px;
      height: 22px;
      border-radius: 5px;
      object-fit: cover;
    }

    .progress-label {
      font-size: 13px;
      font-weight: 700;
      color: #64748B;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .progress-bar-bg {
      flex: 1;
      height: 6px;
      background: #E2E8F0;
      border-radius: 9999px;
      overflow: hidden;
      min-width: 50px;
    }

    .progress-bar-fill {
      height: 100%;
      background: #E0562D;
      width: 14.3%;
      border-radius: 9999px;
      transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .progress-type-tag {
      font-size: 11px;
      font-weight: 700;
      background: #FFF7ED;
      color: #E0562D;
      border: 1px solid #FFEDD5;
      padding: 2px 10px;
      border-radius: 9999px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* Main Container: Chiếm toàn bộ khoảng trống còn lại giữa Top & Bottom */
    .test-main-container {
      flex: 1;
      min-height: 0; /* Quan trọng để flex child không tràn chiều cao */
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px 14px;
      max-width: 540px;
      width: 100%;
      margin: 0 auto;
    }

    @keyframes cardFadeIn {
      0% {
        opacity: 0;
        transform: translateY(8px) scale(0.99);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* Card Câu Hỏi Bo Tròn Gọn Gàng */
    .question-card {
      width: 100%;
      background: #FFFFFF;
      border: 1px solid #E2E8F0;
      border-radius: 16px;
      padding: 14px 16px;
      box-shadow: 0 4px 20px -2px rgba(15, 23, 42, 0.06);
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
    }

    .question-card.animating-in {
      animation: cardFadeIn 0.22s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .question-subject-badge {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #64748B;
      margin-bottom: 3px;
    }

    .question-title {
      font-size: 15.5px;
      font-weight: 700;
      color: #0F172A;
      line-height: 1.35;
      margin-bottom: 5px;
    }

    .question-prompt {
      font-size: 13px;
      color: #475569;
      line-height: 1.4;
      margin-bottom: 6px;
    }

    .question-subtext {
      font-size: 13.5px;
      font-weight: 700;
      color: #0F172A;
      margin: 6px 0 6px;
    }

    /* Code Box Tinh Gọn */
    .code-box {
      background: #F8FAFC;
      border: 1px solid #E2E8F0;
      border-radius: 9px;
      padding: 8px 12px;
      margin: 4px 0 6px;
      overflow-x: auto;
    }

    .code-box pre {
      margin: 0;
      font-family: 'JetBrains Mono', Consolas, Monaco, monospace;
      font-size: 12px;
      line-height: 1.38;
      color: #0F172A;
      white-space: pre;
    }

    /* Canvas Code Image (Q2 & Q5) */
    .canvas-wrapper {
      margin: 4px 0 6px;
      border: 1px solid #E2E8F0;
      border-radius: 9px;
      overflow: hidden;
      background: #F8FAFC;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 6px;
    }

    .canvas-notice {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 600;
      color: #E0562D;
      margin-bottom: 5px;
    }

    .benchmark-canvas {
      max-width: 100%;
      height: auto;
      border-radius: 6px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }

    /* Options Prompt Header */
    .options-header-prompt {
      font-size: 13px;
      font-weight: 700;
      color: #0F172A;
      margin-top: 6px;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .options-header-prompt svg {
      color: #E0562D;
      flex-shrink: 0;
    }

    /* Danh sách 4 Đáp án A - B - C - D */
    .options-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .option-row {
      position: relative;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 12px;
      min-height: 38px;
      background: #FFFFFF;
      border: 1.5px solid #E2E8F0;
      border-radius: 10px;
      cursor: pointer;
      user-select: none;
      transition: all 0.15s ease;
      font-size: 13.5px;
      color: #1E293B;
      line-height: 1.35;
    }

    .option-row:not(.verified-correct):not(.verified-wrong):not(.verified-neutral-wrong):hover {
      border-color: #CBD5E1;
      background: #F8FAFC;
      transform: translateX(3px);
    }

    /* Selected State */
    .option-row.is-selected {
      background: #FFF7ED;
      border-color: #E0562D;
    }

    .option-badge {
      width: 26px;
      height: 26px;
      border-radius: 6px;
      background: #FFFFFF;
      border: 1.5px solid #CBD5E1;
      color: #0F172A;
      font-weight: 700;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.12s ease;
      font-family: 'Inter', sans-serif;
    }

    .option-row.is-selected .option-badge {
      background: #E0562D;
      border-color: #E0562D;
      color: #FFFFFF;
      font-weight: 800;
    }

    .option-text {
      flex: 1;
      user-select: text;
      -webkit-user-select: text;
      padding-right: 6px;
      word-break: break-word;
    }

    @keyframes verdictPopIn {
      0% { opacity: 0; transform: scale(0.6); }
      100% { opacity: 1; transform: scale(1); }
    }

    .verdict-tag {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 9999px;
      text-transform: uppercase;
      display: none;
      flex-shrink: 0;
      margin-left: auto;
    }

    /* Trạng thái xác nhận ĐÚNG / SAI */
    .option-row.verified-correct {
      border: 2px solid #10B981 !important;
      background: #ECFDF5 !important;
    }

    .option-row.verified-correct .verdict-tag {
      display: inline-block;
      background: #10B981;
      color: #FFFFFF;
      animation: verdictPopIn 0.2s ease-out;
    }

    .option-row.verified-correct .option-badge {
      border-color: #10B981 !important;
      background: #10B981 !important;
      color: #FFFFFF !important;
    }

    .option-row.verified-wrong {
      border: 2px solid #EF4444 !important;
      background: #FEF2F2 !important;
    }

    .option-row.verified-wrong .verdict-tag {
      display: inline-block;
      background: #EF4444;
      color: #FFFFFF;
      animation: verdictPopIn 0.2s ease-out;
    }

    .option-row.verified-wrong .option-badge {
      border-color: #EF4444 !important;
      background: #EF4444 !important;
      color: #FFFFFF !important;
    }

    .option-row.verified-correct,
    .option-row.verified-wrong,
    .option-row.verified-neutral-wrong {
      cursor: default;
    }

    .option-row.verified-neutral-wrong {
      border-color: #E2E8F0;
      opacity: 0.5;
    }

    .option-row.verified-neutral-wrong .verdict-tag {
      display: none;
    }

    .option-row.verified-neutral-wrong .option-badge {
      background: #F1F5F9;
      border-color: #CBD5E1;
      color: #94A3B8;
    }

    /* Fixed Bottom Action Bar Gọn Nhẹ */
    .bottom-actions-bar {
      flex-shrink: 0;
      height: 52px;
      background: rgba(248, 250, 252, 0.98);
      border-top: 1px solid #E2E8F0;
      z-index: 50;
      display: flex;
      align-items: center;
    }

    .bottom-actions-inner {
      max-width: 540px;
      width: 100%;
      margin: 0 auto;
      padding: 0 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .secondary-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-circle-action {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: #FFFFFF;
      border: 1.5px solid #E2E8F0;
      color: #0F172A;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 1px 4px rgba(15, 23, 42, 0.05);
      transition: all 0.15s ease;
      flex-shrink: 0;
    }

    .btn-circle-action:hover:not(:disabled) {
      background: #F1F5F9;
      transform: translateY(-1px);
    }

    .btn-circle-action:disabled {
      opacity: 0.3;
      cursor: not-allowed;
      pointer-events: none;
    }

    .btn-circle-action.is-muted {
      color: #94A3B8;
      background: #F8FAFC;
    }

    /* Nút Chính Cam "Xác nhận" / "Tiếp theo" */
    .btn-next-question {
      background: #E0562D;
      color: #FFFFFF;
      font-family: 'Inter', sans-serif;
      font-size: 13.5px;
      font-weight: 700;
      height: 38px;
      padding: 0 20px;
      border-radius: 9999px;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 3px 12px rgba(224, 86, 45, 0.35);
      transition: all 0.15s ease;
      flex: 1;
      max-width: 210px;
    }

    .btn-next-question:hover:not(:disabled) {
      background: #FF5722;
      transform: translateY(-1px);
      box-shadow: 0 4px 16px rgba(224, 86, 45, 0.45);
    }

    .btn-next-question:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <!-- TOP BAR (TÍCH HỢP BRAND + TIẾN TRÌNH TRÊN 1 DÒNG) -->
  <header class="top-header-bar">
    <div class="top-header-inner">
      <a href="index.html" class="brand-tag" title="Về trang chủ ViTai">
        <img src="assets/logo.png" alt="ViTai Logo" class="brand-logo-img" onerror="this.src='assets/icon.ico'">
        <span>ViTai</span>
      </a>

      <span class="progress-label" id="progress-text">Câu 1 / 7</span>

      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progress-fill"></div>
      </div>

      <div class="progress-type-tag" id="progress-tag">Dạng 1 - Code chữ</div>
    </div>
  </header>

  <!-- MAIN VIEWPORT CONTAINER (CỐ ĐỊNH TRONG 1 MÀN HÌNH) -->
  <main class="test-main-container">
    <div class="question-card" id="question-card">
      <!-- Injected by JS -->
    </div>
  </main>

  <!-- BOTTOM BAR (ĐIỀU HƯỚNG GỌN NHẸ) -->
  <footer class="bottom-actions-bar">
    <div class="bottom-actions-inner">
      <div class="secondary-controls">
        <!-- Previous Question -->
        <button type="button" class="btn-circle-action" id="btn-prev-question" title="Câu trước" aria-label="Câu trước">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
        </button>

        <!-- Sound Toggle -->
        <button type="button" class="btn-circle-action" id="btn-sound-toggle" title="Bật/Tắt âm thanh" aria-label="Bật/Tắt âm thanh">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="sound-toggle-icon">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
          </svg>
        </button>

        <!-- Reset Exam -->
        <button type="button" class="btn-circle-action" id="btn-reset-exam" title="Làm lại từ đầu" aria-label="Làm lại từ đầu">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="23 4 23 10 17 10"></polyline>
            <polyline points="1 20 1 14 7 14"></polyline>
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
          </svg>
        </button>
      </div>

      <!-- Primary Action: Xác nhận / Tiếp theo -->
      <button type="button" class="btn-next-question" id="btn-main-action">
        <span id="btn-action-text">Xác nhận</span>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" id="btn-action-icon">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
      </button>
    </div>
  </footer>

  <script>
    /* ==========================================================================
       SoundFX Web Audio API Synthesizer (Không tải tệp âm thanh ngoài)
       ========================================================================== */
    const SoundFX = (() => {
      let ctx = null;
      let masterGain = null;
      let isMuted = false;

      function getAudioContext() {
        if (!ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) {
            ctx = new AudioCtx();
            masterGain = ctx.createGain();
            masterGain.gain.setValueAtTime(0.85, ctx.currentTime);
            masterGain.connect(ctx.destination);
          }
        }
        if (ctx && ctx.state === 'suspended') {
          ctx.resume().catch(() => {});
        }
        return ctx;
      }

      function playTone(opts) {
        if (isMuted) return;
        const ac = getAudioContext();
        if (!ac || !masterGain) return;

        try {
          const osc = ac.createOscillator();
          const gain = ac.createGain();
          osc.type = opts.type || 'sine';
          const now = ac.currentTime;

          if (opts.freqRamp) {
            osc.frequency.setValueAtTime(opts.freqRamp.start, now);
            osc.frequency.exponentialRampToValueAtTime(
              Math.max(1, opts.freqRamp.end),
              now + opts.freqRamp.duration
            );
          } else if (opts.frequency) {
            osc.frequency.setValueAtTime(opts.frequency, now);
          }

          const vol = opts.volume !== undefined ? opts.volume : 0.75;
          gain.gain.setValueAtTime(vol, now);
          const decay = opts.decay || 0.1;
          gain.gain.exponentialRampToValueAtTime(0.0001, now + decay);

          osc.connect(gain);
          gain.connect(masterGain);

          osc.start(now);
          osc.stop(now + decay + 0.05);
        } catch (err) {}
      }

      return {
        get isMuted() { return isMuted; },
        toggleMute() {
          isMuted = !isMuted;
          const btn = document.getElementById('btn-sound-toggle');
          const icon = document.getElementById('sound-toggle-icon');
          if (btn && icon) {
            if (isMuted) {
              btn.classList.add('is-muted');
              icon.innerHTML = `<line x1="1" y1="1" x2="23" y2="23"></line><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>`;
            } else {
              btn.classList.remove('is-muted');
              icon.innerHTML = `<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>`;
              this.boop();
            }
          }
          return isMuted;
        },
        boop() {
          if (isMuted) return;
          playTone({
            type: 'sine',
            freqRamp: { start: 360, end: 540, duration: 0.075 },
            decay: 0.075,
            volume: 0.75
          });
        },
        click() {
          if (isMuted) return;
          playTone({
            type: 'triangle',
            freqRamp: { start: 650, end: 220, duration: 0.035 },
            decay: 0.038,
            volume: 0.80
          });
        },
        correct() {
          if (isMuted) return;
          const ac = getAudioContext();
          if (!ac || !masterGain) return;
          try {
            const now = ac.currentTime;
            const osc1 = ac.createOscillator();
            const gain1 = ac.createGain();
            osc1.type = 'sine';
            osc1.frequency.setValueAtTime(659.25, now);
            gain1.gain.setValueAtTime(0.8, now);
            gain1.gain.exponentialRampToValueAtTime(0.0001, now + 0.28);
            osc1.connect(gain1);
            gain1.connect(masterGain);
            osc1.start(now);
            osc1.stop(now + 0.3);

            const t2 = now + 0.11;
            const osc2 = ac.createOscillator();
            const gain2 = ac.createGain();
            osc2.type = 'triangle';
            osc2.frequency.setValueAtTime(987.77, t2);
            gain2.gain.setValueAtTime(0.85, t2);
            gain2.gain.exponentialRampToValueAtTime(0.0001, t2 + 0.42);
            osc2.connect(gain2);
            gain2.connect(masterGain);
            osc2.start(t2);
            osc2.stop(t2 + 0.45);
          } catch (e) {}
        },
        wrong() {
          if (isMuted) return;
          const ac = getAudioContext();
          if (!ac || !masterGain) return;
          try {
            const now = ac.currentTime;
            const osc = ac.createOscillator();
            const gain = ac.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(210, now);
            osc.frequency.linearRampToValueAtTime(140, now + 0.16);
            gain.gain.setValueAtTime(0.7, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
            osc.connect(gain);
            gain.connect(masterGain);
            osc.start(now);
            osc.stop(now + 0.18);
          } catch (e) {}
        }
      };
    })();

    /* Confetti Particle Burst Khi Đúng */
    function triggerConfettiBurst(originElem) {
      const rect = originElem ? originElem.getBoundingClientRect() : null;
      const startX = rect ? rect.left + rect.width / 2 : window.innerWidth / 2;
      const startY = rect ? rect.top + rect.height / 2 : window.innerHeight / 2;

      const container = document.createElement('div');
      container.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:9999;';
      document.body.appendChild(container);

      const colors = ['#10B981', '#34D399', '#F59E0B', '#E0562D', '#3B82F6'];
      const count = 14;

      for (let i = 0; i < count; i++) {
        const dot = document.createElement('div');
        const angle = (i / count) * 2 * Math.PI + (Math.random() * 0.4 - 0.2);
        const dist = 50 + Math.random() * 60;
        const color = colors[Math.floor(Math.random() * colors.length)];
        const size = 5 + Math.random() * 4;

        dot.style.cssText = `
          position: absolute;
          left: ${startX}px;
          top: ${startY}px;
          width: ${size}px;
          height: ${size}px;
          background: ${color};
          border-radius: 50%;
          transform: translate(-50%, -50%);
          transition: transform 0.5s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.5s ease-out;
          opacity: 1;
        `;
        container.appendChild(dot);

        requestAnimationFrame(() => {
          const targetX = Math.cos(angle) * dist;
          const targetY = Math.sin(angle) * dist - 15;
          dot.style.transform = `translate(calc(-50% + ${targetX}px), calc(-50% + ${targetY}px)) scale(0.6)`;
          dot.style.opacity = '0';
        });
      }

      setTimeout(() => { container.remove(); }, 600);
    }

    const CHECK_SVG = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>`;

    /* ==========================================================================
       Dữ Liệu 7 Câu Hỏi Chuẩn Hoá (Chỉ giữ câu có đáp án, chuẩn 4 phương án A-B-C-D)
       ========================================================================== */
    const BENCHMARK_QUESTIONS = [
      // 1. Dạng 1: Code chữ - C pointer arithmetic
      {
        id: 1,
        typeLabel: "Dạng 1 - Code chữ",
        subject: "Kỹ thuật lập trình C",
        title: "Câu 1: Đoạn mã nguồn C sau đây:",
        prompt: "Quan sát toán tử con trỏ và tăng giảm trên mảng:",
        code: `#include <stdio.h>
int main() {
    int arr[] = {10, 20, 30, 40, 50}, *ptr = arr;
    int a = *ptr++, b = ++*ptr, c = *++ptr;
    printf("%d, %d, %d", a, b, c);
    return 0;
}`,
        questionText: "Kết quả in ra màn hình là gì?",
        isCanvas: false,
        isMultiple: false,
        correctAnswers: ["B"],
        options: [
          { label: "A", text: "10, 20, 30" },
          { label: "B", text: "10, 21, 30" },
          { label: "C", text: "11, 21, 40" },
          { label: "D", text: "10, 21, 40" }
        ]
      },

      // 2. Dạng 2: Code ảnh Canvas - Python Generator
      {
        id: 2,
        typeLabel: "Dạng 2 - Code ảnh (Canvas)",
        subject: "Python Core",
        title: "Câu 2: Đoạn mã Python kết xuất dạng ảnh:",
        prompt: "Dùng phím tắt Alt + S (Vision) của ViTai để khoanh vùng ảnh:",
        code: `def num_generator():
    for i in range(1, 10):
        if i % 2 != 0: yield i

filtered = [x for x in num_generator()]
result = sum(filtered[::2])
print(result)`,
        questionText: "Giá trị của biến result in ra là gì?",
        isCanvas: true,
        isMultiple: false,
        correctAnswers: ["B"],
        options: [
          { label: "A", text: "25" },
          { label: "B", text: "15" },
          { label: "C", text: "10" },
          { label: "D", text: "16" }
        ]
      },

      // 3. Dạng 3: Lý thuyết CSDL ACID - Đa đáp án (3 đáp án đúng)
      {
        id: 3,
        typeLabel: "Dạng 3 - CSDL ACID (3 đúng)",
        subject: "Cơ sở dữ liệu",
        title: "Câu 3: Các tính chất của Transaction trong mô hình ACID",
        prompt: "Xét các đặc điểm của Giao dịch (Transaction). Chọn các phát biểu ĐÚNG:",
        code: null,
        questionText: null,
        isCanvas: false,
        isMultiple: true,
        correctAnswers: ["A", "B", "C"],
        options: [
          { label: "A", text: "Atomicity: Toàn bộ thao tác thành công hoặc toàn bộ bị hủy bỏ." },
          { label: "B", text: "Consistency: Dữ liệu chuyển từ trạng thái hợp lệ này sang trạng thái khác." },
          { label: "C", text: "Isolation: Các giao dịch đồng thời không can thiệp kết quả của nhau." },
          { label: "D", text: "Atomicity cho phép lưu lại một phần dữ liệu nếu xảy ra lỗi giữa chừng." }
        ]
      },

      // 4. Dạng 4: C++ Static variable recursion
      {
        id: 4,
        typeLabel: "Dạng 4 - C++ Đệ quy",
        subject: "Kỹ thuật lập trình C++",
        title: "Câu 4: Hàm đệ quy C++ có biến tĩnh (static):",
        prompt: "Quan sát giá trị tích lũy của biến static:",
        code: `#include <iostream>
using namespace std;
int func(int n) {
    static int count = 0;
    count += n;
    if (n <= 1) return count;
    return func(n - 1) + func(n - 2);
}
int main() {
    cout << func(3);
    return 0;
}`,
        questionText: "Giá trị in ra màn hình console là bao nhiêu?",
        isCanvas: false,
        isMultiple: false,
        correctAnswers: ["B"],
        options: [
          { label: "A", text: "12" },
          { label: "B", text: "16" },
          { label: "C", text: "8" },
          { label: "D", text: "14" }
        ]
      },

      // 5. Dạng 5: C cấp phát động con trỏ cấp 2 (Canvas)
      {
        id: 5,
        typeLabel: "Dạng 5 - C Con trỏ (Canvas)",
        subject: "Kỹ thuật lập trình C",
        title: "Câu 5: Quản lý bộ nhớ động và con trỏ cấp 2 trong C:",
        prompt: "Mã nguồn dạng hình ảnh. Dùng Alt + S để quét vùng ảnh:",
        code: `#include <stdio.h>
#include <stdlib.h>
void modify(int **ptr) {
    **ptr += 5;
    *ptr = (int *)malloc(sizeof(int));
    **ptr = 20;
}

    int x = 10, *p = &x;
    modify(&p);
    printf("%d, %d", x, *p);
    free(p);
    return 0;
}`,
        questionText: "Chương trình sẽ in ra màn hình kết quả nào?",
        isCanvas: true,
        isMultiple: false,
        correctAnswers: ["C"],
        options: [
          { label: "A", text: "10, 20" },
          { label: "B", text: "20, 20" },
          { label: "C", text: "15, 20" },
          { label: "D", text: "15, 10" }
        ]
      },

      // 6. Dạng 6: Java Abstract vs Interface - Đa đáp án (2 đáp án đúng)
      {
        id: 6,
        typeLabel: "Dạng 6 - Java Interface (2 đúng)",
        subject: "Lập trình hướng đối tượng Java",
        title: "Câu 6: So sánh Abstract Class và Interface trong Java",
        prompt: "Xét các quy tắc trong Java (từ Java 8 trở lên). Chọn các phát biểu ĐÚNG:",
        code: null,
        questionText: null,
        isCanvas: false,
        isMultiple: true,
        correctAnswers: ["A", "B"],
        options: [
          { label: "A", text: "Một class chỉ kế thừa tối đa 1 abstract class nhưng có thể implement nhiều interface." },
          { label: "B", text: "Interface từ Java 8 có thể chứa phương thức default có phần thân xử lý." },
          { label: "C", text: "Abstract class không thể chứa hàm dựng (constructor)." },
          { label: "D", text: "Không thể khai báo bất kỳ phương thức static nào bên trong một Interface." }
        ]
      },

      // 7. Dạng 7: Python List Comprehension matrix slicing
      {
        id: 7,
        typeLabel: "Dạng 7 - Python Thuật toán",
        subject: "Python Thuật toán & Mảng",
        title: "Câu 7: Xử lý ma trận bằng List Comprehension:",
        prompt: "Quan sát đoạn lọc số lẻ và bước nhảy slice:",
        code: `matrix = [
    [1, 2, 3],
    [4, 5, 6],
    [7, 8, 9]
]
flatten = [val for row in matrix for val in row if val % 2 != 0]
res = sum(flatten[::2])
print(res)`,
        questionText: "Kết quả in ra màn hình của đoạn code là gì?",
        isCanvas: false,
        isMultiple: false,
        correctAnswers: ["B"],
        options: [
          { label: "A", text: "25" },
          { label: "B", text: "15" },
          { label: "C", text: "10" },
          { label: "D", text: "16" }
        ]
      }
    ];

    let currentQuestionIndex = 0;
    let isAnswerVerified = false;
    const userSelections = {};
    const questionStatus = {};

    function getOptionEvaluation(q, label, isSelected) {
      const correctSet = new Set(q.correctAnswers || []);
      const isCorrectOption = correctSet.has(label);

      if (q.isMultiple) {
        if (isCorrectOption && isSelected) {
          return { rowClass: 'verified-correct', verdictText: 'Đúng ✓', badgeContent: CHECK_SVG };
        } else if (isCorrectOption && !isSelected) {
          return { rowClass: 'verified-wrong', verdictText: 'Thiếu ✗', badgeContent: label };
        } else if (!isCorrectOption && isSelected) {
          return { rowClass: 'verified-wrong', verdictText: 'Thừa ✗', badgeContent: CHECK_SVG };
        } else {
          return { rowClass: 'verified-neutral-wrong', verdictText: '', badgeContent: label };
        }
      } else {
        if (isSelected && isCorrectOption) {
          return { rowClass: 'verified-correct', verdictText: 'Đúng ✓', badgeContent: CHECK_SVG };
        } else if (isSelected && !isCorrectOption) {
          return { rowClass: 'verified-wrong', verdictText: 'Sai ✗', badgeContent: CHECK_SVG };
        } else if (!isSelected && isCorrectOption) {
          return { rowClass: 'verified-correct', verdictText: 'Đúng ✓', badgeContent: label };
        } else {
          return { rowClass: 'verified-neutral-wrong', verdictText: '', badgeContent: label };
        }
      }
    }

    function renderCurrentQuestion() {
      const q = BENCHMARK_QUESTIONS[currentQuestionIndex];
      const card = document.getElementById('question-card');
      const progressText = document.getElementById('progress-text');
      const progressFill = document.getElementById('progress-fill');
      const progressTag = document.getElementById('progress-tag');
      const btnPrev = document.getElementById('btn-prev-question');

      if (!userSelections[q.id]) {
        userSelections[q.id] = new Set();
      }

      const isAlreadyVerified = Boolean(questionStatus[q.id]);

      // Cập nhật Header
      if (progressText) progressText.textContent = `Câu ${currentQuestionIndex + 1} / ${BENCHMARK_QUESTIONS.length}`;
      if (progressFill) progressFill.style.width = `${((currentQuestionIndex + 1) / BENCHMARK_QUESTIONS.length) * 100}%`;
      if (progressTag) progressTag.textContent = q.typeLabel;

      if (btnPrev) {
        btnPrev.disabled = (currentQuestionIndex === 0);
      }

      let html = `
        <div class="question-subject-badge">${escapeHtml(q.subject)}</div>
        <h2 class="question-title">${escapeHtml(q.title)}</h2>
        <p class="question-prompt">${escapeHtml(q.prompt)}</p>
      `;

      // Canvas / Code
      if (q.isCanvas) {
        html += `
          <div class="canvas-wrapper">
            <div class="canvas-notice">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="8" x2="12" y2="12"></line>
                <line x1="12" y1="16" x2="12.01" y2="16"></line>
              </svg>
              <span>Vùng ảnh Canvas • Dùng phím Alt + S để quét vùng ảnh:</span>
            </div>
            <canvas id="benchmark-canvas-element" class="benchmark-canvas"></canvas>
          </div>
        `;
      } else if (q.code) {
        html += `
          <div class="code-box">
            <pre><code>${escapeHtml(q.code)}</code></pre>
          </div>
        `;
      }

      if (q.questionText) {
        html += `<p class="question-subtext">${escapeHtml(q.questionText)}</p>`;
      }

      // Nhãn Chọn phương án
      const promptLabel = q.isMultiple ? "Chọn các phương án đúng:" : "Chọn một phương án đúng nhất:";
      html += `
        <div class="options-header-prompt">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 11 12 14 22 4"></polyline>
            <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
          </svg>
          <span>${escapeHtml(promptLabel)}</span>
        </div>
      `;

      // Render đúng 4 options A, B, C, D
      html += `<div class="options-list" id="options-container">`;
      q.options.forEach(opt => {
        const isSelected = userSelections[q.id].has(opt.label);
        let rowClasses = ['option-row'];
        let verdictText = '';
        let badgeHtml = isSelected ? CHECK_SVG : opt.label;

        if (isSelected) {
          rowClasses.push('is-selected');
        }

        if (isAlreadyVerified) {
          const evalResult = getOptionEvaluation(q, opt.label, isSelected);
          rowClasses.push(evalResult.rowClass);
          verdictText = evalResult.verdictText;
          badgeHtml = evalResult.badgeContent;
        }

        const cleanText = opt.text.replace(/^[A-Da-d]\.\s*/, '');
        html += `
          <div class="${rowClasses.join(' ')}" data-label="${opt.label}">
            <div class="option-badge" id="badge-${opt.label}">
              ${badgeHtml}
            </div>
            <div class="option-text">${escapeHtml(cleanText)}</div>
            <span class="verdict-tag" id="verdict-${opt.label}">${verdictText}</span>
          </div>
        `;
      });
      html += `</div>`;

      card.innerHTML = html;

      // Hiệu ứng chuyển động mượt mà
      card.classList.remove('animating-in');
      void card.offsetWidth;
      card.classList.add('animating-in');

      isAnswerVerified = isAlreadyVerified;
      updateMainActionButtonState();

      if (q.isCanvas) {
        setTimeout(() => { renderCanvasCodeOnly(q); }, 10);
      }

      bindOptionClickEvents(q);
    }

    function bindOptionClickEvents(q) {
      const container = document.getElementById('options-container');
      if (!container) return;

      const rows = container.querySelectorAll('.option-row');
      rows.forEach(row => {
        row.addEventListener('click', (e) => {
          if (isAnswerVerified) return;

          // Nếu người dùng đang bôi đen chữ để test Alt+Q thì không kích hoạt chọn
          const selection = window.getSelection();
          if (selection && selection.toString().trim().length > 0) {
            return;
          }

          SoundFX.boop();

          const label = row.getAttribute('data-label');
          const badge = document.getElementById(`badge-${label}`);

          if (userSelections[q.id].has(label)) {
            userSelections[q.id].delete(label);
            row.classList.remove('is-selected');
            if (badge) badge.textContent = label;
          } else {
            if (!q.isMultiple) {
              userSelections[q.id].clear();
              rows.forEach(r => {
                r.classList.remove('is-selected');
                const b = r.querySelector('.option-badge');
                if (b) b.textContent = r.getAttribute('data-label');
              });
            }
            userSelections[q.id].add(label);
            row.classList.add('is-selected');
            if (badge) badge.innerHTML = CHECK_SVG;
          }
        });
      });
    }

    function updateMainActionButtonState() {
      const btnText = document.getElementById('btn-action-text');
      const btnIcon = document.getElementById('btn-action-icon');
      if (!btnText || !btnIcon) return;

      if (!isAnswerVerified) {
        btnText.textContent = "Xác nhận";
        btnIcon.innerHTML = `<polyline points="20 6 9 17 4 12"></polyline>`;
      } else {
        if (currentQuestionIndex === BENCHMARK_QUESTIONS.length - 1) {
          btnText.textContent = "Hoàn tất & Về trang chủ";
        } else {
          btnText.textContent = "Câu tiếp theo";
        }
        btnIcon.innerHTML = `<line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline>`;
      }
    }

    function verifyCurrentQuestion() {
      const q = BENCHMARK_QUESTIONS[currentQuestionIndex];
      const selectedSet = userSelections[q.id] || new Set();
      const correctSet = new Set(q.correctAnswers || []);

      const isCorrect = (selectedSet.size === correctSet.size) &&
                        ([...selectedSet].every(item => correctSet.has(item)));

      questionStatus[q.id] = isCorrect ? 'correct' : 'wrong';

      if (isCorrect) {
        SoundFX.correct();
        triggerConfettiBurst(document.getElementById('btn-main-action'));
      } else {
        SoundFX.wrong();
      }

      const rows = document.querySelectorAll('.option-row');
      rows.forEach(row => {
        const label = row.getAttribute('data-label');
        const isUserPicked = selectedSet.has(label);
        const evalResult = getOptionEvaluation(q, label, isUserPicked);
        const verdictSpan = document.getElementById(`verdict-${label}`);
        const badge = document.getElementById(`badge-${label}`);

        row.classList.remove('verified-correct', 'verified-wrong', 'verified-neutral-wrong');
        row.classList.add(evalResult.rowClass);

        if (verdictSpan) {
          verdictSpan.textContent = evalResult.verdictText;
        }
        if (badge) {
          badge.innerHTML = evalResult.badgeContent;
        }
      });

      isAnswerVerified = true;
      updateMainActionButtonState();
    }

    function handleMainAction() {
      if (!isAnswerVerified) {
        verifyCurrentQuestion();
      } else {
        if (currentQuestionIndex < BENCHMARK_QUESTIONS.length - 1) {
          currentQuestionIndex++;
          renderCurrentQuestion();
        } else {
          window.location.href = 'index.html';
        }
      }
    }

    /* Vẽ Canvas Sắc Nét 2x Nhỏ Gọn (Q2 & Q5) */
    function renderCanvasCodeOnly(q) {
      const canvas = document.getElementById('benchmark-canvas-element');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const dpr = window.devicePixelRatio || 2;

      const card = document.getElementById('question-card');
      const maxW = card ? Math.min(480, card.clientWidth - 32) : 420;
      const logicalWidth = Math.max(280, maxW);

      const codeLines = q.code ? q.code.split('\n') : [];
      const codeBoxHeight = (codeLines.length * 17) + 20;
      const logicalHeight = 32 + codeBoxHeight + 10;

      canvas.width = logicalWidth * dpr;
      canvas.height = logicalHeight * dpr;
      canvas.style.width = logicalWidth + 'px';
      canvas.style.height = logicalHeight + 'px';

      ctx.scale(dpr, dpr);

      // Nền trắng
      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(0, 0, logicalWidth, logicalHeight);

      // Viền ngoài
      ctx.strokeStyle = '#E2E8F0';
      ctx.lineWidth = 1;
      ctx.strokeRect(0, 0, logicalWidth, logicalHeight);

      // Thanh tiêu đề macOS mô phỏng
      ctx.fillStyle = '#F8FAFC';
      ctx.fillRect(0, 0, logicalWidth, 28);
      ctx.strokeStyle = '#E2E8F0';
      ctx.strokeRect(0, 0, logicalWidth, 28);

      // Nút đỏ, vàng, xanh
      ctx.fillStyle = '#EF4444'; ctx.beginPath(); ctx.arc(14, 14, 4, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#F59E0B'; ctx.beginPath(); ctx.arc(28, 14, 4, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#10B981'; ctx.beginPath(); ctx.arc(42, 14, 4, 0, Math.PI * 2); ctx.fill();

      // Tiêu đề
      ctx.fillStyle = '#64748B';
      ctx.font = '600 11px "Inter", sans-serif';
      ctx.fillText(`${q.subject} - Code Image (Alt + S)`, 58, 18);

      // Khối code tối
      ctx.fillStyle = '#0F172A';
      ctx.fillRect(8, 32, logicalWidth - 16, codeBoxHeight);

      // Chữ code
      ctx.fillStyle = '#F8FAFC';
      ctx.font = '500 11.5px "JetBrains Mono", Consolas, monospace';
      codeLines.forEach((line, idx) => {
        ctx.fillText(line, 18, 50 + (idx * 17));
      });
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderCurrentQuestion();

      const btnMainAction = document.getElementById('btn-main-action');
      if (btnMainAction) {
        btnMainAction.addEventListener('click', handleMainAction);
      }

      const btnPrev = document.getElementById('btn-prev-question');
      if (btnPrev) {
        btnPrev.addEventListener('click', () => {
          if (currentQuestionIndex > 0) {
            SoundFX.click();
            currentQuestionIndex--;
            renderCurrentQuestion();
          }
        });
      }

      const btnSound = document.getElementById('btn-sound-toggle');
      if (btnSound) {
        btnSound.addEventListener('click', () => {
          SoundFX.toggleMute();
        });
      }

      const btnReset = document.getElementById('btn-reset-exam');
      if (btnReset) {
        btnReset.addEventListener('click', () => {
          SoundFX.click();
          if (confirm('Làm lại bài kiểm thử từ Câu 1?')) {
            currentQuestionIndex = 0;
            for (let k in userSelections) delete userSelections[k];
            for (let k in questionStatus) delete questionStatus[k];
            renderCurrentQuestion();
          }
        });
      }

      window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft') {
          if (currentQuestionIndex > 0) {
            SoundFX.click();
            currentQuestionIndex--;
            renderCurrentQuestion();
          }
        } else if (e.key === 'ArrowRight' || e.key === 'Enter') {
          if (document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') {
            handleMainAction();
          }
        }
      });

      window.addEventListener('resize', () => {
        const q = BENCHMARK_QUESTIONS[currentQuestionIndex];
        if (q.isCanvas) {
          renderCanvasCodeOnly(q);
        }
      });
    });
  </script>
